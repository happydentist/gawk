name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-glibc,  runner: ubuntu-latest,    os: linux,   libc: glibc, cc: gcc }
          - { target: aarch64-linux-glibc, runner: ubuntu-24.04-arm, os: linux,   libc: glibc, cc: gcc }
          - { target: aarch64-macos,       runner: macos-14,         os: macos,                cc: clang }
          - { target: x86_64-macos,        runner: macos-14,         os: macos,                cc: clang }
          - { target: x86_64-windows,      runner: windows-latest,   os: windows,              cc: gcc }
          - { target: aarch64-windows,     runner: windows-11-arm,   os: windows,              cc: gcc }
    continue-on-error: ${{ matrix.target == 'aarch64-windows' }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. 各平台依賴安裝（精準補全）
      # -------------------------------------------------------------
      - name: Install deps (Linux glibc)
        if: matrix.libc == 'glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool gettext bison \
            libreadline-dev libgmp-dev libmpfr-dev libncurses-dev

      - name: Install deps (macOS)
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install autoconf automake libtool bison gettext readline gmp mpfr

      - name: Install deps (Windows MSYS2 + mingw64)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # 💡 修正 Windows：加入 gettext-devel 與 xz，徹底解決 autopoint 找不到封裝檔的崩潰
          install: >-
            git autoconf automake libtool
            make base-devel bison gettext gettext-devel xz

      # -------------------------------------------------------------
      # 2. 執行您的專案建置腳本（修復環境變數隔離與庫連結問題）
      # -------------------------------------------------------------
      - name: Run build script (Linux)
        if: matrix.os == 'linux'
        # 💡 修正 Linux CC：前置注入變數，繞過子 Shell 隔離
        run: CC=${{ matrix.cc }} HOST=${{ matrix.cc }} bash scripts/build.sh

      - name: Run build script (macOS)
        if: matrix.os == 'macos'
        # 💡 修正 macOS otool：強制讓編譯器尋找 Homebrew 獨立庫，避免黏到系統不給打包的 libedit
        run: |
          export LDFLAGS="-L$(brew --prefix readline)/lib -L$(brew --prefix gmp)/lib -L$(brew --prefix mpfr)/lib"
          export CPPFLAGS="-I$(brew --prefix readline)/include -I$(brew --prefix gmp)/include -I$(brew --prefix mpfr)/include"
          CC=${{ matrix.cc }} HOST=${{ matrix.cc }} bash scripts/build.sh

      - name: Run build script (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: CC=${{ matrix.cc }} HOST=${{ matrix.cc }} bash scripts/build.sh

      # -------------------------------------------------------------
      # 3. 執行冒煙測試
      # -------------------------------------------------------------
      - name: Run smoke tests
        if: success() || matrix.target == 'aarch64-windows'
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
        run: bash scripts/smoke.sh

      # -------------------------------------------------------------
      # 4. 執行您專案內的打包腳本（產生 tar.gz / zip 與個別 sha256）
      # -------------------------------------------------------------
      - name: Package artifacts
        if: success() || matrix.target == 'aarch64-windows'
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
        run: bash scripts/package.sh

      # -------------------------------------------------------------
      # 5. 上傳本階段產物至臨時區
      # -------------------------------------------------------------
      - name: Upload temporary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gawk-artifacts-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  # -----------------------------------------------------------------
  # 6. 獨立的發布作業：收集所有平台產物、彙整總表並推送到 GitHub Release
  # -----------------------------------------------------------------
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gawk-artifacts-*
          merge-multiple: true
          path: dist

      - name: Generate top-level SHA256SUMS
        run: |
          cd dist
          # 收集所有 package.sh 算好的 sha256 內容，整合成一個頂層總表
          cat *.sha256 > SHA256SUMS 2>/dev/null || true
          echo "=== Final Release Files ==="
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
