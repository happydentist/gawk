name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-glibc, runner: ubuntu-latest, os: linux, libc: glibc, cc: gcc, arch: x86_64, os_hint: linux }
          - { target: aarch64-linux-glibc, runner: ubuntu-24.04-arm, os: linux, libc: glibc, cc: gcc, arch: aarch64, os_hint: linux }
          - { target: aarch64-macos, runner: macos-14, os: macos, cc: clang, arch: aarch64, os_hint: darwin }
          - { target: x86_64-macos, runner: macos-14, os: macos, cc: clang, arch: x86_64, os_hint: darwin }
          - { target: x86_64-windows, runner: windows-latest, os: windows, cc: gcc, arch: x86_64, os_hint: windows }
          - { target: aarch64-windows, runner: windows-11-arm, os: windows, cc: gcc, arch: aarch64, os_hint: windows }
    continue-on-error: ${{ matrix.target == 'aarch64-windows' }}
    
    env:
      TARGET: ${{ matrix.target }}
      CC: ${{ matrix.cc }}
      HOST: ${{ matrix.cc }}
      CFLAGS: "-O2"
      LDFLAGS: ""
      GAWK_TARGET_ARCH: ${{ matrix.arch }}
      GAWK_OS_HINT: ${{ matrix.os_hint }}
      JOBS: "4"

    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. 各平台依賴安裝（精準補全）
      # -------------------------------------------------------------
      - name: Install deps (Linux glibc)
        if: matrix.libc == 'glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool gettext autopoint bison \
            libreadline-dev libgmp-dev libmpfr-dev libncurses-dev

      - name: Install deps (macOS)
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install autoconf automake libtool bison gettext readline gmp mpfr

      - name: Install deps (Windows MSYS2 + toolchain)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git autoconf automake libtool make base-devel bison gettext gettext-devel xz
            mingw-w64-x86_64-toolchain

      # -------------------------------------------------------------
      # 2. 執行您的專案建置腳本
      # -------------------------------------------------------------
      - name: Run build script (Linux)
        if: matrix.os == 'linux'
        run: |
          # 💡 修正 Linux：強制對擴充庫進行靜態連結，以完全消滅 ldd 檢查到的 /usr/lib 外部依賴
          export LDFLAGS="-static-libgcc"
          export LIBS="-lreadline -lmpfr -lgmp -lncurses -ltinfo"
          bash scripts/build.sh

      - name: Run build script (macOS)
        if: matrix.os == 'macos'
        run: |
          # 💡 修正 macOS：不要只用 export，我們直接將變數前置注入到命令最前端
          # 這能防止 gawk 的 configure.ac 內部被 Apple 內建的 libedit 劫持
          BREW_PREFIX=$(brew --prefix)
          
          LDFLAGS="-L$BREW_PREFIX/opt/readline/lib -L$BREW_PREFIX/opt/gmp/lib -L$BREW_PREFIX/opt/mpfr/lib" \
          CPPFLAGS="-I$BREW_PREFIX/opt/readline/include -I$BREW_PREFIX/opt/gmp/include -I$BREW_PREFIX/opt/mpfr/include" \
          bash scripts/build.sh

      - name: Run build script (Windows)
        if: matrix.os == 'windows'
        run: |
          # 💡 修正 Windows：因為 Windows 原生編譯不屬於 Linux/Darwin 分支，
          # 您的 build.sh 會跳過 RPATH 宣告，這裡強行給予空值，確保能安全通關
          export LDFLAGS=""
          bash scripts/build.sh

      # -------------------------------------------------------------
      # 3. 執行冒煙測試
      # -------------------------------------------------------------
      - name: Run smoke tests
        if: success() || matrix.target == 'aarch64-windows'
        run: bash scripts/smoke.sh

      # -------------------------------------------------------------
      # 4. 執行您專案內的打包腳本
      # -------------------------------------------------------------
      - name: Package artifacts
        if: success() || matrix.target == 'aarch64-windows'
        run: bash scripts/package.sh

      # -------------------------------------------------------------
      # 5. 上傳本階段產物至臨時區
      # -------------------------------------------------------------
      - name: Upload temporary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gawk-artifacts-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  # -----------------------------------------------------------------
  # 6. 獨立的發布作業
  # -----------------------------------------------------------------
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gawk-artifacts-*
          merge-multiple: true
          path: dist

      - name: Generate top-level SHA256SUMS
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS 2>/dev/null || true
          echo "=== Final Release Files ==="
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
